<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Keyko CRM: arquitectura y flujo</title>
  <desc id="desc">Flujo desde WhatsApp y Kapso hasta el CRM en React, pasando por Cloudflare Workers, Turso y OpenRouter.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#8A7B68" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2F7C92"/>
    </marker>
    <style>
      .title { font: 700 34px/1.1 system-ui, -apple-system, Segoe UI, sans-serif; fill: #263238; }
      .subtitle { font: 500 15px/1.4 system-ui, -apple-system, Segoe UI, sans-serif; fill: #5F6B70; }
      .box-title { font: 700 16px/1.25 system-ui, -apple-system, Segoe UI, sans-serif; fill: #263238; }
      .box-text { font: 500 12.5px/1.35 system-ui, -apple-system, Segoe UI, sans-serif; fill: #5F6B70; }
      .chip { font: 600 12.5px/1 system-ui, -apple-system, Segoe UI, sans-serif; fill: #2F7C92; }
      .tiny { font: 600 11px/1 system-ui, -apple-system, Segoe UI, sans-serif; fill: #8A7B68; letter-spacing: .08em; text-transform: uppercase; }
      .arrow-label { font: 600 11px/1 system-ui, -apple-system, Segoe UI, sans-serif; fill: #8A7B68; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="#FBF7F0"/>

  <!-- Encabezado -->
  <circle cx="76" cy="66" r="28" fill="#DCEFF4"/>
  <text x="76" y="76" text-anchor="middle" style="font: 700 24px system-ui; fill:#2F7C92">K</text>
  <text x="120" y="62" class="title">Keyko CRM</text>
  <text x="120" y="88" class="subtitle">Demo técnica · arquitectura y flujo de datos</text>
  <text x="1140" y="70" text-anchor="end" class="tiny">WhatsApp → IA → CRM</text>

  <!-- WhatsApp -->
  <g filter="url(#shadow)">
    <rect x="48" y="172" width="220" height="82" rx="18" fill="#DCEFF4" stroke="#B9DCE8"/>
  </g>
  <text x="76" y="204" class="box-title">WhatsApp</text>
  <text x="76" y="226" class="box-text">Texto · audio · foto</text>

  <!-- Kapso -->
  <g filter="url(#shadow)">
    <rect x="328" y="172" width="220" height="82" rx="18" fill="#F3E6D2" stroke="#E4D2B8"/>
  </g>
  <text x="356" y="204" class="box-title">Kapso</text>
  <text x="356" y="226" class="box-text">Webhook + medios</text>

  <!-- Worker -->
  <g filter="url(#shadow)">
    <rect x="608" y="150" width="250" height="126" rx="20" fill="#2F7C92"/>
  </g>
  <text x="636" y="188" style="font:700 17px system-ui; fill:#FFFFFF">Cloudflare Worker API</text>
  <text x="636" y="214" style="font:500 12.5px system-ui; fill:#E8F5F8">Hono · cron cada 2 min</text>
  <text x="636" y="235" style="font:500 12.5px system-ui; fill:#E8F5F8">jobs · guardas · presupuesto</text>
  <text x="636" y="256" style="font:500 12.5px system-ui; fill:#E8F5F8">aislamiento por negocio</text>

  <!-- Turso -->
  <g filter="url(#shadow)">
    <rect x="608" y="332" width="250" height="84" rx="18" fill="#F6D9C9" stroke="#EBC4B2"/>
  </g>
  <text x="636" y="364" class="box-title">Turso / libSQL</text>
  <text x="636" y="386" class="box-text">clientes · mascotas · ventas</text>
  <text x="636" y="403" class="box-text">mensajes · IA · auditoría</text>

  <!-- AI Jobs -->
  <g filter="url(#shadow)">
    <rect x="608" y="470" width="250" height="82" rx="18" fill="#F3E6D2" stroke="#E4D2B8"/>
  </g>
  <text x="636" y="502" class="box-title">ai_jobs</text>
  <text x="636" y="524" class="box-text">lotes · reintentos · idempotencia</text>

  <!-- OpenRouter -->
  <g filter="url(#shadow)">
    <rect x="918" y="150" width="234" height="126" rx="20" fill="#DCEFF4" stroke="#B9DCE8"/>
  </g>
  <text x="946" y="184" class="box-title">OpenRouter</text>
  <text x="946" y="208" class="box-text">gpt-4o-mini</text>
  <text x="946" y="226" class="box-text">gpt-4o-mini-transcribe</text>
  <text x="946" y="244" class="box-text">verificador + visión</text>
  <text x="946" y="262" class="box-text">una sola API key</text>

  <!-- React -->
  <g filter="url(#shadow)">
    <rect x="918" y="332" width="234" height="84" rx="18" fill="#FFFFFF" stroke="#E4D2B8"/>
  </g>
  <text x="946" y="364" class="box-title">React CRM</text>
  <text x="946" y="386" class="box-text">Bandeja · fichas · agenda</text>
  <text x="946" y="403" class="box-text">ventas · IA</text>

  <!-- R2 -->
  <g filter="url(#shadow)">
    <rect x="328" y="332" width="220" height="84" rx="18" fill="#FFFFFF" stroke="#E4D2B8"/>
  </g>
  <text x="356" y="364" class="box-title">R2 privado</text>
  <text x="356" y="386" class="box-text">fotos de mascotas</text>
  <text x="356" y="403" class="box-text">token corto · sin URL pública</text>

  <!-- Resultados -->
  <g filter="url(#shadow)">
    <rect x="918" y="470" width="234" height="82" rx="18" fill="#F3E6D2" stroke="#E4D2B8"/>
  </g>
  <text x="946" y="502" class="box-title">Sugerencias</text>
  <text x="946" y="524" class="box-text">cliente · mascota · cita</text>

  <!-- Flechas horizontales -->
  <path d="M 268 213 H 320" stroke="#2F7C92" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 548 213 H 600" stroke="#2F7C92" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 858 213 H 910" stroke="#2F7C92" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 1035 276 V 324" stroke="#2F7C92" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Flechas verticales / datos -->
  <path d="M 733 276 V 324" stroke="#2F7C92" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 733 416 V 462" stroke="#2F7C92" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 858 511 H 910" stroke="#2F7C92" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <text x="286" y="202" class="arrow-label">mensaje</text>
  <text x="556" y="201" class="arrow-label" style="font-size:10.5px">webhook</text>
  <text x="878" y="202" class="arrow-label">IA</text>

  <!-- Herramientas -->
  <line x1="48" y1="620" x2="1152" y2="620" stroke="#E4D2B8"/>
  <text x="48" y="652" class="tiny">Herramientas</text>

  <g>
    <rect x="48" y="672" width="122" height="38" rx="19" fill="#FFFFFF" stroke="#E4D2B8"/>
    <text x="109" y="696" text-anchor="middle" class="chip">React</text>
    <rect x="182" y="672" width="144" height="38" rx="19" fill="#FFFFFF" stroke="#E4D2B8"/>
    <text x="254" y="696" text-anchor="middle" class="chip">TypeScript</text>
    <rect x="338" y="672" width="112" height="38" rx="19" fill="#FFFFFF" stroke="#E4D2B8"/>
    <text x="394" y="696" text-anchor="middle" class="chip">Hono</text>
    <rect x="462" y="672" width="146" height="38" rx="19" fill="#FFFFFF" stroke="#E4D2B8"/>
    <text x="535" y="696" text-anchor="middle" class="chip">Cloudflare</text>
    <rect x="620" y="672" width="112" height="38" rx="19" fill="#FFFFFF" stroke="#E4D2B8"/>
    <text x="676" y="696" text-anchor="middle" class="chip">Turso</text>
    <rect x="744" y="672" width="122" height="38" rx="19" fill="#FFFFFF" stroke="#E4D2B8"/>
    <text x="805" y="696" text-anchor="middle" class="chip">Drizzle</text>
    <rect x="878" y="672" width="158" height="38" rx="19" fill="#FFFFFF" stroke="#E4D2B8"/>
    <text x="957" y="696" text-anchor="middle" class="chip">OpenRouter</text>
    <rect x="1048" y="672" width="104" height="38" rx="19" fill="#FFFFFF" stroke="#E4D2B8"/>
    <text x="1100" y="696" text-anchor="middle" class="chip">Vitest</text>
  </g>
</svg>
